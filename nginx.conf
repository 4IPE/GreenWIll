events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логирование
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Балансировка с учетом health checks
    upstream frontend_servers {
        least_conn;
        server gw-frontend:3000 max_fails=3 fail_timeout=30s;
        server gw-frontend:3001 max_fails=3 fail_timeout=30s;
    }

    upstream client_servers {
        least_conn;
        server gw-client:8080 max_conns=50 max_fails=3 fail_timeout=30s;
        server gw-client:8081 max_conns=50 max_fails=3 fail_timeout=30s;
    }

    upstream service_servers {
        least_conn;
        server gw-service:9090 max_conns=50 max_fails=3 fail_timeout=30s;
        server gw-service:9091 max_conns=50 max_fails=3 fail_timeout=30s;
        server gw-service:9092 max_conns=50 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoints
        location /health/client {
            proxy_pass http://client_servers/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            access_log off;

            # Добавляем заголовки с информацией о сервере
            add_header X-Upstream $upstream_addr;
            add_header X-Response-Time $request_time;
        }

        location /health/service {
            proxy_pass http://service_servers/actuator/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
            access_log off;

            add_header X-Upstream $upstream_addr;
            add_header X-Response-Time $request_time;
        }

        # Основные маршруты
        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Переключение при ошибках
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        location /api/ {
            proxy_pass http://client_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Переключение при ошибках
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }

        # Обработка ошибок
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}