version: '3.8'

services:
  gw-frontend:
    build: gw-ui
    image: gw-ui-img
    env_file:
      - ./gw-ui/.env.local
    networks:
      - gw-internal  # 🔹 Локальная сеть
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: "on-failure"
    deploy:
      mode: replicated
      replicas: 2
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type == frontend

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gw-frontend
    networks:
      - gw-internal
      - gw-overlay
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.type == frontend

networks:
  gw-internal:
    driver: bridge
  gw-overlay:
    driver: overlay
    attachable: true
