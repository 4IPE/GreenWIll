version: '3.8'

services:
  gw-client:
    build: gw-client
    image: gw-client-img
    scale: 2
    ports:
      - "8080-8081:8080"
    depends_on:
      - gw-service
      - gw-frontend
    networks:
      - gw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: "on-failure"

  gw-frontend:
    build: gw-ui
    image: gw-ui-img
    scale: 2
    ports:
      - "3000-3001:3000"
    networks:
      - gw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: "on-failure"

  gw-service:
    build: gw-service
    image: gw-service-img
    scale: 3
    ports:
      - "9090-9092:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://gw-db:5432/gw-data
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: 12345
    depends_on:
      - gw-db
      - gw-redis
    networks:
      - gw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: "on-failure"
    
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gw-frontend
      - gw-service
      - gw-client
    networks:
      - gw-network

  gw-db:
    image: postgres:16.1
    container_name: gw-db-con
    ports:
      - "6542:5432"
    environment:
      - POSTGRES_PASSWORD=12345
      - POSTGRES_USER=admin
      - POSTGRES_DB=gw-data
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
    volumes:
      - gw-db-data:/var/lib/postgresql/data
    networks:
      - gw-network

  gw-redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gw-network

volumes:
  gw-db-data:

networks:
  gw-network:
    driver: bridge