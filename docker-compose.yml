version: '3.8'

services:
  gw-frontend:
    image: gw-ui-img
    env_file:
      - ./gw-ui/.env.local
    networks:
      - gw-overlay  # 🔹 Фронтенд в `gw-overlay`
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.type == frontend

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gw-frontend
    networks:
      - gw-overlay  # 🔹 Nginx тоже в `gw-overlay`
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.type == frontend

networks:
  gw-overlay:
    external: true
