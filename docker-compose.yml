version: '3.8'

services:
  gw-frontend:
    build: gw-ui
    image: gw-ui-img
    env_file:
      - ./gw-ui/.env.local
    networks:
      - gw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: "on-failure"


  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gw-frontend
    networks:
      - gw-network

networks:
  gw-network:
    driver: bridge