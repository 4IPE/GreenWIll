version: '3.8'

services:
  gw-client:
    build: gw-client
    image: gw-client-img
    depends_on:
      - consul
      - gw-frontend
    networks:
      - gw-network
    restart: "on-failure"

  gw-frontend:
    build: gw-ui
    image: gw-ui-img
    env_file:
      - ./gw-ui/.env.local
    networks:
      - gw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: "on-failure"

  gw-service:
    build: ./gw-service
    env_file:
      - ./gw-service/.env
    image: gw-service-img
    depends_on:
      - gw-db
      - gw-redis
      - gw-client
    networks:
      - gw-network
    restart: "on-failure"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gw-frontend
      - gw-service
      - gw-client
    networks:
      - gw-network

  gw-db:
    image: postgres:16.1
    container_name: gw-db-con
    ports:
      - "6542:5432"
    env_file:
      - ./gw-db/.env
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
    volumes:
      - gw-db-data:/var/lib/postgresql/data
    networks:
      - gw-network

  gw-redis:
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - gw-network
  consul:
    image: consul:1.14.0
    container_name: consul
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    ports:
      - "8500:8500" # Consul Web UI
      - "8600:8600/udp" # DNS interface
    networks:
      - gw-network
    restart: always
volumes:
  gw-db-data:

networks:
  gw-network:
    driver: bridge